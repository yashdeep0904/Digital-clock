<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Glassmorphism Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background element -->
    <div class="background-gradient"></div>

    <!-- 3D Perspective Wrapper -->
    <div class="clock-wrapper">
        <div class="clock-container glass" id="clock-3d">
            
            <!-- Floating Analog Ring (Layer 1) -->
            <div class="analog-seconds-container layer-1">
                <div class="second-hand-pivot" id="second-hand-pivot">
                    <div class="second-hand-dot"></div>
                </div>
            </div>
            
            <!-- Floating Digital Display (Layer 3 - Highest) -->
            <div class="digital-display layer-3">
                <span id="hours-minutes">00:00</span>
                <span id="seconds-display">00</span>
                <span id="ampm">AM</span>
            </div>
            
            <!-- Floating Toggle (Layer 2) -->
            <div class="toggle-wrapper layer-2">
                <span class="toggle-label">12H</span>
                <label class="switch">
                    <input type="checkbox" id="format-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label">24H</span>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
